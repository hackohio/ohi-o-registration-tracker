name: Registration reports
on:
  schedule:
    - cron: '0 9,20 * * *'
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    strategy:
      fail-fast: false
      matrix:
        include:
          - event: hack
            webhook_secret: HACKOHIO_DISCORD_WEBHOOK_URL
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      QUALTRICS_API_KEY: ${{ secrets.QUALTRICS_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets[matrix.webhook_secret] }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m ohi_o_reg_tracker report --event "${{ matrix.event }}"
