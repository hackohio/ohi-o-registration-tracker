name: Registration reports
on:
  repository_dispatch:
    types: [registration-report]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    strategy:
      fail-fast: false
      matrix:
        include:
          - event: hack
            webhook_secret: HACKOHIO_DISCORD_WEBHOOK_URL
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      QUALTRICS_API_KEY: ${{ secrets.QUALTRICS_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets[matrix.webhook_secret] }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up uv and restore dependency cache
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Send registration report
        run: uv run python -m ohi_o_reg_tracker report --event "${{ matrix.event }}"
