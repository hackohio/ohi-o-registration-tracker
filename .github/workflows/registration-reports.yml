name: Registration reports
on:
  repository_dispatch:
    types: [registration-report]
  workflow_dispatch:
    inputs:
      events:
        description: Which reports to send
        required: true
        type: choice
        options:
          - Both
          - Hack only
          - HS only
        default: Both
permissions:
  contents: read
jobs:
  report:
    strategy:
      fail-fast: false
      matrix:
        event: ${{ fromJSON(inputs.events == 'Hack only' && '["hack"]' || inputs.events == 'HS only' && '["highschool"]' || '["hack","highschool"]') }}
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      QUALTRICS_API_KEY: ${{ secrets.QUALTRICS_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets[matrix.event == 'hack' && 'HACKOHIO_DISCORD_WEBHOOK_URL' || 'HSIO_DISCORD_WEBHOOK_URL'] }}
      GOOGLE_SHEETS_API_SECRET: ${{ matrix.event == 'highschool' && secrets.HSIO_SHEETS_API_SECRET || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up uv and restore dependency cache
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Send registration report
        run: uv run python -m ohi_o_reg_tracker report --event "${{ matrix.event }}"
