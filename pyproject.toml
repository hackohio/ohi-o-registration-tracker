[project]
name = "ohi-o-registration-tracker"
version = "0.1.0"
description = "Generate OHI/O registration reports from Qualtrics and Discord."
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ohi_o_reg_tracker"]
